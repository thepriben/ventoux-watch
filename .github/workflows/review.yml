name: review

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  apply:
    if: github.event.label.name == 'valide' || github.event.label.name == 'rejete'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record the verdict
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          LABEL: ${{ github.event.label.name }}
        run: python scripts/apply_review.py
      - name: Commit the verdict
        run: |
          if git diff --quiet -- data/events.json data/learning.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/events.json data/learning.json
          git commit -m "Enregistre la validation d'une déduction"
          git push
      - name: Close the review
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: gh issue close "$NUMBER" --repo "$REPO" --comment "La déduction est enregistrée dans l'historique."
      - name: Rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages --ref main
