name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the exhibition
        run: |
          mkdir -p _site/data/thumbs
          cp -R site/. _site/
          cp data/events.json _site/data/events.json
          if [ -f data/learning.json ]; then cp data/learning.json _site/data/learning.json; fi
          if [ -d data/thumbs ]; then cp -R data/thumbs/. _site/data/thumbs/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
